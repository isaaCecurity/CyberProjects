# RULE 1 - Explicit SQL Injection block on DVWA's 'id' parameter
SecRule ARGS:id "@rx (?i:(?:'|\"|%27|%22)\s*(?:or|and)\s*[\w'\"]+\s*=\s*[\w'\"]+|union\s+(?:all\s+)?select|--|/\*|information_schema)" \
    "id:100001,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,\
     msg:'LAB-100001: SQL Injection pattern detected in id parameter',tag:'attack-sqli',tag:'OWASP_CRS/WEB_ATTACK/SQL_INJECTION',severity:'CRITICAL'"

# RULE 2 - Explicit XSS block on DVWA's 'name' parameter
SecRule ARGS:name "@rx (?i:<\s*script|javascript\s*:|on\w+\s*=|<\s*img[^>]*src|<\s*svg|<\s*iframe)" \
    "id:100002,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:htmlEntityDecode,\
     msg:'LAB-100002: Cross-Site Scripting (XSS) pattern detected in name parameter',tag:'attack-xss',tag:'OWASP_CRS/WEB_ATTACK/XSS',severity:'CRITICAL'"

# RULE 3 - Generic SQLi keyword guard for PrestaShop
SecRule ARGS "@rx (?i:(?:union\s+(?:all\s+)?select|(?:'|\")\s*or\s+\d+\s*=\s*\d+|benchmark\s*\(|sleep\s*\(|into\s+outfile))" \
    "id:100003,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,chain,msg:'LAB-100003: SQLi keywords in PrestaShop request',tag:'attack-sqli',severity:'CRITICAL'"
    SecRule REQUEST_URI "@beginsWith /prestashop" "t:none"

# RULE 4 - Generic XSS guard for PrestaShop
SecRule ARGS "@rx (?i:<\s*script|javascript\s*:|onerror\s*=|onload\s*=|<\s*iframe|<\s*svg[^>]*onload)" \
    "id:100004,phase:2,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,t:htmlEntityDecode,chain,msg:'LAB-100004: XSS payload in PrestaShop request',tag:'attack-xss',severity:'CRITICAL'"
    SecRule REQUEST_URI "@beginsWith /prestashop" "t:none"

# RULE 5 - PrestaShop back-office IP allow-list
SecRule REQUEST_URI "@beginsWith /prestashop/admin055m5g1i9ktx3gtl8ow" \
    "id:100005,phase:1,deny,status:403,log,auditlog,msg:'LAB-100005: Back-office access denied - IP not in allow-list',chain"
    SecRule REMOTE_ADDR "!@ipMatch 127.0.0.1,::1" "t:none"

# RULE 6 - Block access to PrestaShop /install leftovers
SecRule REQUEST_URI "@beginsWith /prestashop/install" \
    "id:100006,phase:1,deny,status:403,log,auditlog,msg:'LAB-100006: Probe against leftover /install directory blocked',severity:'WARNING'"

# RULE 7 - Reject path-traversal probes
SecRule REQUEST_URI "@rx \.\./|\.\.\\|%2e%2e" \
    "id:100007,phase:1,deny,status:403,log,auditlog,t:none,t:urlDecodeUni,msg:'LAB-100007: Path traversal attempt blocked',tag:'attack-lfi',severity:'CRITICAL'"

# RULE 8 - Rate-limit repeated 403 offenders
SecAction "id:100008,phase:1,pass,log,initcol:ip=%{REMOTE_ADDR},msg:'LAB-100008: IP collection initialized'"
SecRule IP:BLOCK_COUNT "@gt 5" "id:100009,phase:1,deny,status:403,log,msg:'LAB-100009: IP temporarily banned - more than 5 blocked requests in 60s'"
SecRule RESPONSE_STATUS "@rx ^403$" "id:100010,phase:5,pass,log,setvar:ip.block_count=+1,expirevar:ip.block_count=60"
